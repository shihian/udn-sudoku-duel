name: Live Firebase multiplayer acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - firebase-room.js
      - app.js
      - tests/live-firebase.cjs
      - .github/workflows/live-firebase.yml
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify live Firebase with two independent browsers
        run: node tests/live-firebase.cjs
