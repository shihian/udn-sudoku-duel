name: Firebase database rules acceptance
on:
  push:
    paths:
      - firebase-emulator.json
      - firebase.rules.json
      - firebase-room.js
      - tests/firebase-rules.cjs
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:
jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and test libraries
        run: npm install --no-save --package-lock=false firebase-tools@14 @firebase/rules-unit-testing@4
      - name: Compile rules and test permissions
        run: npx firebase emulators:exec --project demo-sudoku-universe --only database --config firebase-emulator.json "node tests/firebase-rules.cjs"
