name: Sudoku smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and DOM IDs
        run: |
          node tests/smoke.cjs
          node --check cloudflare/src/index.js
