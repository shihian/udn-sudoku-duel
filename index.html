<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨小宇宙｜單人・好友對決</title><link rel="stylesheet" href="./style.css"><script defer src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script defer src="./app.js"></script></head><body><main class="wrap"><header><p class="eyebrow">SUDOKU UNIVERSE ✦</p><h1>數獨小宇宙</h1><p>一個人慢慢玩，或邀朋友一起比速度。</p></header><section class="panel setup" id="setup"><div class="switch"><button id="soloTab" class="active">☕ 單人練習</button><button id="duelTab">⚡ 好友對決</button></div><div class="fields"><label>你的暱稱<input id="name" maxlength="16" placeholder="輸入暱稱"></label><label>難度<select id="difficulty"><option value="easy">入門</option><option value="medium">普通</option><option value="hard">困難</option><option value="expert">高手</option></select></label></div><div class="actions"><button id="soloNew" class="primary">開始單人新關卡</button><button id="host" class="primary hidden">建立多人房間</button><button id="join" class="hidden">加入邀請房間</button></div><p id="joinInfo"></p></section><section class="panel hidden" id="roomPanel"><div class="row"><h2>好友房間 <span id="roomId"></span></h2><button id="leave">離開</button></div><div class="invite"><input id="inviteUrl" readonly aria-label="邀請連結"><button id="copy">複製邀請</button></div><p id="roomNote"></p><div id="roster" class="roster"></div><div class="actions"><button id="ready" class="primary">我準備好了</button><button id="start" class="primary hidden">所有人準備好，開始倒數</button><button id="next" class="hidden">再戰一局</button></div></section><section class="panel hidden" id="game"><div class="gamehead"><div><small id="modeLabel">單人練習</small><strong id="stage">第 1 關</strong></div><div><small>時間</small><strong id="clock">00:00</strong></div><div><small>已填</small><strong id="filled">0/81</strong></div></div><p id="gameNotice"></p><div class="layout"><div><div id="board" class="board" role="grid" aria-label="9乘9數獨"></div><p class="hint">每行、每列、每個 3×3 宮格都填入 1–9。最後一格正確填完，會自動完成。</p></div><aside><div class="tools"><button id="notes">✎ 筆記：關</button><button id="erase">⌫ 清除</button><button id="undo">↶ 復原</button><button id="hintBtn">💡 提示</button></div><div id="pad" class="pad"></div><div class="actions"><button id="check">檢查</button><button id="newSolo">下一關</button></div><p class="hint">支援鍵盤 1–9、方向鍵、Backspace。單人模式會保存在本機。</p></aside></div></section><p id="message" role="status"></p><footer>好友休閒版・不需帳號或資料庫・多人連線需要網路與免費訊號服務</footer></main><div id="modal" class="overlay hidden"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalBody"></p><button id="modalClose" class="primary">關閉</button></div></div></body></html>
