<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨雙人對決</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script defer src="app.js"></script></head><body><main><header><p>SUDOKU DUEL</p><h1>⚡ 數獨雙人對決</h1><p>同一題、同時開始、先解完獲勝</p></header><section id="setup" class="panel"><h2>連線設定</h2><label>Supabase Project URL<input id="url" placeholder="https://xxx.supabase.co"></label><label>Publishable / anon key<input id="key" placeholder="sb_publishable_..."></label><button id="connect">儲存並連線</button><span id="connected">尚未連線</span></section><section id="lobby" class="panel"><h2>邀請好友</h2><label>你的暱稱<input id="name" maxlength="16" placeholder="輸入暱稱"></label><label>難度<select id="diff"><option value="easy">入門</option><option value="medium">普通</option><option value="hard">困難</option></select></label><div class="actions"><button id="create" class="primary">建立房間</button><button id="join">加入好友房間</button></div></section><section id="room" class="panel hidden"><h2>房間 <span id="roomcode"></span></h2><p id="players">等待玩家</p><p id="roomstatus"></p><div class="actions"><button id="copy">複製邀請連結</button><button id="ready" class="primary">我準備好了</button></div><p id="progress"></p></section><section id="game" class="panel hidden"><div class="actions"><strong id="status">等待開始</strong><strong id="time">00:00</strong></div><div id="board" class="board"></div><div id="numpad" class="numpad"></div><div class="actions"><button id="erase">清除</button><button id="reset">重新填寫</button><button id="submit" class="primary">提交答案</button></div></section><p id="message" role="status"></p><footer>雙人線上試玩版 · 無獎品與排行榜 · 使用匿名登入</footer></main></body></html>
