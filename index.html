<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨小宇宙｜單人・多人對決</title><link rel="stylesheet" href="./style.css?v=20261013-countdown-go"><script type="module" src="./app.js?v=20261013-countdown-go"></script></head><body><main><header><p class="eyebrow">SUDOKU UNIVERSE ✦</p><h1>數獨小宇宙</h1><p>一個人動動腦，或邀朋友一起比速度。</p></header><section class="panel" id="lobby"><div class="tabs"><button id="soloTab" class="active">☕ 單人</button><button id="duelTab">⚡ 多人對決</button></div><div class="fields"><label>棋盤<select id="boardSize"><option value="3">3×3 快速測試（推薦）</option><option value="9">9×9 完整版</option></select></label><label>玩法<select id="variant"><option value="classic">經典數獨</option><option value="killer">算數變形・殺手數獨</option></select></label><label>難度<select id="difficulty"><option value="easy">入門</option><option value="medium">普通</option><option value="hard">困難</option><option value="expert">高手</option></select></label></div><div class="actions"><button id="soloNew" class="primary">開始單人新關卡</button><button id="host" class="hidden primary">建立多人房間</button><button id="join" class="hidden">加入好友房間</button></div><p id="joinInfo"></p></section><section id="roomPanel" class="panel hidden"><div class="actions"><h2>好友房間 <span id="roomId"></span></h2><button id="leave">離開</button></div><div class="actions"><input id="inviteUrl" readonly aria-label="邀請連結"><button id="copy">複製邀請</button></div><p id="myIdentity" class="my-identity" aria-live="polite">正在確認你的玩家身分…</p><p id="roomNote"></p><p id="winnerInfo" class="winner-info" aria-live="polite"></p><div id="roster"></div><div class="actions"><button id="ready" class="primary">我準備好了</button><button id="start" class="hidden primary">開始倒數</button><button id="next" class="hidden">再戰一局</button></div></section><section id="game" class="panel hidden"><div class="gamehead"><strong id="modeLabel">單人</strong><div class="game-level"><strong id="stage">第 1 關</strong><select id="levelSelect" aria-label="選擇關卡"></select></div><strong id="clock">00:00</strong><strong id="filled">0/81</strong><button id="answerToggle" type="button" aria-pressed="true">答案提示：開</button></div><p id="gameNotice"></p><div class="layout"><div><div id="board" class="board" role="grid" aria-label="9乘9數獨"></div><p id="rules" class="hint"></p></div><aside><div class="tools"><button id="notes">✎ 筆記：關</button><button id="erase">⌫ 清除</button><button id="undo">↶ 復原</button><button id="hintBtn">💡 提示</button></div><div id="pad" class="pad"></div><div class="actions"><button id="check">檢查</button><button id="nextSolo">下一關</button></div></aside></div></section><p id="message" role="status"></p><footer>單人免網路・多人透過 Firebase 雲端房間同步・純好友休閒版</footer></main><div id="countdownOverlay" class="countdown-overlay hidden" role="status" aria-live="off" aria-label="比賽倒數"><div class="countdown-content"><p>數獨小宇宙 · 多人競速</p><div id="countdownNumber" class="countdown-number">5</div><strong>準備開始！</strong></div></div><div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalBody"></p><button id="modalClose" class="primary">關閉</button><button id="modalNext">下一關</button></div></div></body></html>
